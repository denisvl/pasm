metadata:
  name: CSX64DefaultSystem
  title: PASM Commodore SX-64
  version: "1.0"

clock_hz: 1022727
reset_delay_seconds: 0

memory:
  default_size: 65536
  regions:
    - name: RAM_LO
      start: 0x0000
      size: 0x8000
      read_write: true
    - name: CART_8K
      start: 0x8000
      size: 0x2000
      read_only: true
    - name: ROM_BASIC
      start: 0xA000
      size: 0x2000
      read_only: true
    - name: RAM_MID
      start: 0xC000
      size: 0x1000
      read_write: true
    - name: ROM_CHAR
      start: 0xD000
      size: 0x1000
      read_only: true
    - name: ROM_KERNAL
      start: 0xE000
      size: 0x2000
      read_only: true
  rom_images:
    - name: csx64_basic_rom
      file: ../../roms/csx64/basic.901226-01.bin
      target_region: ROM_BASIC
      offset: 0
    - name: csx64_char_rom
      file: ../../roms/csx64/characters.901225-01.bin
      target_region: ROM_CHAR
      offset: 0
    - name: csx64_kernal_rom
      file: ../../roms/csx64/kernal.901227-03.bin
      target_region: ROM_KERNAL
      offset: 0

hooks: {}
integrations:
  profile: csx64_default

components:
  ics: []
  devices: []
  hosts: []

automation:
  screen:
    text_views:
      - id: primary_text
        component: c64_vic_ii
        columns: 40
        rows: 25
        row_stride: 40
        memory:
          source: system_memory
          base: 0x0400
          address_layout: linear
        charset: c64_char_rom
        native_encoding: c64_screen_code
        unicode_map: c64_screen_text
        unknown_policy: preserve_native
  readiness:
    default_recipe: boot_to_ready
    recipes:
      - id: boot_to_ready
        reset: cold
        warmup_frames: 180
        stable_frames: 2
        media_defaults:
          cassette: empty
          floppy: empty
          cartridge: empty
        wait_for_text:
          view: primary_text
          contains: "READY."
  capabilities:
    - screen.text_grid
    - input.keyboard_matrix
    - input.controller
    - media.cassette
    - media.floppy
    - media.cartridge

connections: []
