metadata:
  name: MOS6510C64GSInteractiveSystem
  title: PASM C64 Games System (C64GS)
  version: '0.1'
clock_hz: 985248
reset_delay_seconds: 0
memory:
  default_size: 65536
  regions:
  - name: ROM_BASIC
    start: 40960
    size: 8192
    read_only: true
  - name: ROM_KERNAL
    start: 57344
    size: 8192
    read_only: true
  - name: ROM_CHAR
    start: 53248
    size: 4096
    read_only: true
  - name: RAM_MAIN
    start: 0
    size: 65536
    read_write: true
  rom_images:
  - name: c64gs_basic_rom
    file: ../../roms/64gs/64gs.390852-01.bin
    target_region: ROM_BASIC
    offset: 0
    load_size: 8192
  - name: c64gs_kernal_rom
    file: ../../roms/64gs/64gs.390852-01.bin
    target_region: ROM_KERNAL
    offset: 0
    file_offset: 8192
    load_size: 8192
  - name: c64gs_char_rom
    file: ../../roms/64gs/characters_64gs.bin
    target_region: ROM_CHAR
    offset: 0
hooks:
  pre_fetch:
    enabled: false
  post_decode:
    enabled: false
  post_execute:
    enabled: false
  port_read_pre:
    enabled: false
  port_read_post:
    enabled: false
  port_write_pre:
    enabled: false
  port_write_post:
    enabled: false
components:
  ics:
  - c64_vic_ii
  - c64_sid
  - c64_cia1
  - c64_cia2
  - c64_color_ram
  - c64_pla
  - c64_main_ram
  devices:
  - keyboard_c64
  - joystick_c64
  - video_c64
  - tv
  - speaker
  hosts:
  - host_c64
  cartridge: c64_cart0
automation:
  screen:
    text_views:
    - id: primary_text
      component: c64_vic_ii
      columns: 40
      rows: 25
      row_stride: 40
      memory:
        source: system_memory
        base: 0x0400
        address_layout: linear
      charset: c64_char_rom
      native_encoding: c64_screen_code
      unicode_map: c64_screen_text
      unknown_policy: preserve_native
connections:
- from:
    component: c64_pla
    kind: callback
    name: keyboard_row
  to:
    component: keyboard_c64
    kind: callback
    name: read_row
- from:
    component: keyboard_c64
    kind: callback
    name: host_matrix
  to:
    component: host_c64
    kind: callback
    name: keyboard_matrix
- from:
    component: c64_pla
    kind: callback
    name: joystick_port
  to:
    component: joystick_c64
    kind: callback
    name: read_port
- from:
    component: joystick_c64
    kind: callback
    name: host_port
  to:
    component: host_c64
    kind: callback
    name: joystick_port
- from:
    component: c64_pla
    kind: signal
    name: frame_ready
  to:
    component: video_c64
    kind: handler
    name: on_frame_ready
- from:
    component: video_c64
    kind: signal
    name: frame_present
  to:
    component: tv
    kind: handler
    name: on_frame_present
- from:
    component: c64_pla
    kind: signal
    name: audio_level
  to:
    component: tv
    kind: handler
    name: on_audio_level
- from:
    component: tv
    kind: signal
    name: frame_present
  to:
    component: host_c64
    kind: handler
    name: video_frame
- from:
    component: tv
    kind: signal
    name: pcm_sample
  to:
    component: host_c64
    kind: handler
    name: audio_pcm
