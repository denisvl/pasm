metadata:
  name: Apple2PlusDefaultSystem
  title: PASM Apple II Plus
  version: "0.1"

clock_hz: 1023000
reset_delay_seconds: 0

memory:
  default_size: 65536
  regions:
    - name: RAM_MAIN
      start: 0x0000
      size: 0xC000
      read_write: true
    - name: ROM_SYSTEM
      start: 0xD000
      size: 0x3000
      read_only: true
  rom_images:
    - name: apple2plus_rom
      file: ../../roms/apple2plus/apple2-asoft-auto.rom
      target_region: ROM_SYSTEM
      offset: 0

hooks: {}
integrations:
  profile: apple2plus_default

components:
  ics: []
  devices: []
  hosts: []

automation:
  screen:
    text_views:
      - id: primary_text
        component: apple2_video_softswitches
        columns: 40
        rows: 24
        row_stride: 40
        memory:
          source: system_memory
          base: 0x0400
          alternate_base: 0x0800
          address_layout: bit_interleaved_rows
          row_low_mask: 0x07
          row_low_shift: 7
          row_high_shift: 3
          row_high_multiplier: 0x28
          column_multiplier: 1
        charset: apple2_character_rom
        native_encoding: apple2_screen_code
        unicode_map: apple2_text
        unknown_policy: preserve_native
        mode_conditions:
          text_switch: true
          mixed_switch: false
          page2_selects_alternate_base: true
        attributes:
          inverse_range: [0x00, 0x3F]
          flash_range: [0x40, 0x7F]
          normal_range: [0x80, 0xFF]
  readiness:
    default_recipe: boot_to_monitor
    recipes:
      - id: boot_to_monitor
        reset: cold
        warmup_frames: 120
        stable_frames: 2
        media_defaults:
          cassette: empty
          floppy: empty
        wait_for_text:
          view: primary_text
          contains: "]"
  capabilities:
  - screen.text_grid
  - input.keyboard
  - input.controller
  - media.cassette
  - media.floppy

connections: []
