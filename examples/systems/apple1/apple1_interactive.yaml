metadata:
  name: Apple1InteractiveSystem
  title: PASM Apple I
  version: '0.1'

clock_hz: 1023000
reset_delay_seconds: 0

memory:
  default_size: 65536
  regions:
    - name: RAM_MAIN
      start: 0x0000
      size: 0xC000
      read_write: true
    - name: IO_REGION_LOW
      start: 0xC000
      size: 0x0100
      read_write: true
    - name: ROM_ACI
      start: 0xC100
      size: 0x0100
      read_only: true
    - name: IO_REGION_HIGH
      start: 0xC200
      size: 0x3D00
      read_write: true
    - name: ROM_WOZMON
      start: 0xFF00
      size: 0x0100
      read_only: true
  rom_images:
    - name: aci_rom
      file: ../../roms/apple1/aci.rom
      target_region: ROM_ACI
      offset: 0
      load_size: 0x0100
    - name: wozmon_rom
      file: ../../roms/apple1/wozmon.bin
      target_region: ROM_WOZMON
      offset: 0
      load_size: 0x0100

hooks: {}

components:
  ics:
    - apple1_pia_6820
    - apple1_char_rom
    - apple1_aci_card
  devices:
    - apple1_keyboard
    - apple1_video
    - cassette_transport_nomotor
    - monitor
  hosts:
    - host_apple1
  cassette: apple1_aci_card

cassette:
  component: apple1_aci_card
  directory: examples/cassettes/apple1
  allowed_extensions: [yaml, wav, mp3]
  sources:
    - kind: file
      source_type: ../../cassette_sources/wav_file.yaml
      component: apple1_aci_card
      label: Tape File
      allowed_extensions: [yaml, wav, mp3]
    - kind: line_in
      source_type: ../../cassette_sources/line_in.yaml
      component: apple1_aci_card
      label: Line In
  controls:
    picker_action_id: EMU_MEDIA_PICKER
    play_action_id: EMU_CASSETTE_PLAY
    pause_action_id: EMU_CASSETTE_PAUSE
    stop_action_id: EMU_CASSETTE_STOP
    record_action_id: EMU_CASSETTE_RECORD
    volume_up_action_id: EMU_CASSETTE_VOL_UP
    volume_down_action_id: EMU_CASSETTE_VOL_DOWN
    bass_up_action_id: EMU_CASSETTE_BASS_UP
    bass_down_action_id: EMU_CASSETTE_BASS_DOWN
    treble_up_action_id: EMU_CASSETTE_TREBLE_UP
    treble_down_action_id: EMU_CASSETTE_TREBLE_DOWN

connections:
  - from:
      component: apple1_video
      kind: signal
      name: frame_present
    to:
      component: monitor
      kind: handler
      name: on_frame_present
  - from:
      component: monitor
      kind: signal
      name: frame_present
    to:
      component: host_apple1
      kind: handler
      name: video_frame
display:
  default_component: monitor
  default_model: generic_crt_monitor_green
  runtime_switchable: true
  available_models:
    - component: monitor
      model: generic_crt_monitor_green
automation:
  screen:
    text_views:
      - id: primary_text
        component: apple1_video
        columns: 40
        rows: 24
        row_stride: 40
        memory:
          source: system_memory
          base: 0xD000
          address_layout: linear
        charset: apple1_character_rom
        native_encoding: ascii
        unicode_map: ascii
        unknown_policy: preserve_native
