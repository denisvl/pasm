behavior:
  snippets:
    init: "do {\n    if (comp->host_inited != 0u) break;\n    {\n        const char *disable_dead = cpu_host_hal_getenv(\"PASM_DISABLE_DEADKEYS\");\n        if (disable_dead == NULL || disable_dead[0] != '0') {\n            #if defined(__linux__)\n            /* Keep scancode flow deterministic by disabling XIM dead-key composition for this process. */\n            setenv(\"XMODIFIERS\", \"@im=none\", 1);\n            setenv(\"GTK_IM_MODULE\", \"xim\", 0);\n            setenv(\"QT_IM_MODULE\", \"xim\", 0);\n            #endif\n        }\n    }\n    if (cpu_host_hal_init(CPU_HOST_INIT_VIDEO | CPU_HOST_INIT_AUDIO | CPU_HOST_INIT_EVENTS) != 0) {\n        break;\n    }\n    int window_w = 560;\n    int window_h = 384;\n    cpu_host_hal_display_window_size(\n        cpu->comp_monitor.display_width,\n        cpu->comp_monitor.display_height,\n        cpu->comp_monitor.aspect_width,\n        cpu->comp_monitor.aspect_height,\n        cpu->comp_monitor.display_inches,\n        560,\n        384,\n        &window_w,\n        &window_h\n    );\n    comp->window = cpu_host_hal_create_window(\n        CPU_SYSTEM_TITLE,\n        CPU_HOST_WINDOWPOS_CENTERED,\n        CPU_HOST_WINDOWPOS_CENTERED,\n        window_w,\n        window_h,\n        CPU_HOST_WINDOW_RESIZABLE\n    );\n    if (comp->window == NULL) break;\n    comp->renderer = cpu_host_hal_create_renderer(comp->window, -1, CPU_HOST_RENDERER_ACCELERATED);\n    if (comp->renderer == NULL) {\n        comp->renderer = cpu_host_hal_create_renderer(comp->window, -1, 0);\n    }\n    if (comp->renderer == NULL) break;\n    {\n        static const char *apple1_crt_vertex_shader =\n            \"#version 330 core\\n\"\n            \"layout (location = 0) in vec3 aPos;\\n\"\n            \"layout (location = 1) in vec2 aTexCoords;\\n\"\n            \"out vec2 TexCoords;\\n\"\n            \"void main() {\\n\"\n            \"    TexCoords = aTexCoords;\\n\"\n            \"    gl_Position = vec4(aPos, 1.0);\\n\"\n            \"}\\n\";\n        static const char *apple1_crt_fragment_shader =\n            \"#version 330 core\\n\"\n            \"in vec2 TexCoords;\\n\"\n            \"out vec4 FragColor;\\n\"\n            \"uniform sampler2D screenTexture;\\n\"\n            \"uniform float uTime;\\n\"\n            \"void main() {\\n\"\n            \"    vec2 uv = TexCoords;\\n\"\n            \"    vec4 color = texture(screenTexture, uv);\\n\"\n            \"    // Green phosphor CRT effect\\n\"\n            \"    float vignette = 1.0 - 0.3 * length(uv - 0.5) * 2.0;\\n\"\n            \"    float scanline = 0.85 + 0.15 * sin(uv.y * 384.0 * 4.0);\\n\"\n            \"    float r = color.r * 0.1;\\n\"\n            \"    float g = color.g * vignette * scanline;\\n\"\n            \"    float b = color.b * 0.1;\\n\"\n            \"    FragColor = vec4(r, g, b, 1.0);\\n\"\n            \"}\\n\";\n        comp->display_shader = cpu_host_hal_create_shader(comp->renderer, apple1_crt_vertex_shader, apple1_crt_fragment_shader);\n    }\n    // Create texture for 40x24 text display (8x16 font = 320x384, scaled to 560x384)\n    comp->texture = cpu_host_hal_create_texture(comp->renderer, CPU_HOST_PIXELFORMAT_ARGB8888, CPU_HOST_TEXTUREACCESS_STREAMING, 560, 384);\n    if (comp->texture == NULL) break;\n    comp->texture_w = 560u;\n    comp->texture_h = 384u;\n    // Audio setup for 1-bit speaker\n    comp->audio_rate = 44100u;\n    comp->audio_channels = 1u;\n    comp->audio_ring_capacity = comp->audio_rate * 2u;\n    comp->audio_ring = (int16_t *)cpu_host_hal_malloc((size_t)comp->audio_ring_capacity * sizeof(int16_t));\n    if (comp->audio_ring != NULL) {\n        memset(comp->audio_ring, 0, (size_t)comp->audio_ring_capacity * sizeof(int16_t));\n        comp->audio_out_dev = cpu_host_hal_audio_open(comp->audio_rate, CPU_HOST_AUDIO_FORMAT_S16, comp->audio_channels, 1024);\n        if (comp->audio_out_dev != 0u) {\n            comp->audio_out_ready = 1u;\n        }\n    }\n    cpu_host_hal_start_text_input();\n    comp->host_inited = 1u;\n} while (0)\n"
    reset: "comp->frame_count = 0u;\ncomp->audio_samples = 0u;\ncomp->audio_level = 0;\ncomp->audio_last_cycle = 0u;\ncomp->audio_sample_cursor = 0u;\ncomp->audio_ring_read_idx = 0u;\ncomp->audio_ring_write_idx = 0u;\ncomp->audio_ring_fill = 0u;\ncomp->last_event_poll_cycle = 0u;\ncomp->overlay_last_ms = 0u;\ncomp->overlay_last_frame_count = 0u;\ncomp->overlay_last_cycle_count = 0u;\ncomp->overlay_fps_x100 = 0u;\ncomp->overlay_cpu_hz = 0u;\ncomp->overlay_cpu_pct_x10 = 0u;\nif (comp->audio_out_dev != 0u) {\n    cpu_host_hal_audio_clear(comp->audio_out_dev);\n}\ncomp->display_shader_supported = (comp->display_shader != NULL) ? -1 : 0;\n"
    step_post: "if (comp->host_inited == 0u) return;\nstatic int kb_trace = -1;\nstatic FILE *kb_trace_fp = NULL;\nif (kb_trace < 0) {\n    const char *trace_env = cpu_host_hal_getenv(\"PASM_APPLE1_KB_TRACE\");\n    kb_trace = (trace_env != NULL && trace_env[0] != '\\0' && trace_env[0] != '0') ? 1 : 0;\n    if (kb_trace != 0) {\n        const char *trace_file = cpu_host_hal_getenv(\"PASM_APPLE1_KB_TRACE_FILE\");\n        if (trace_file == NULL || trace_file[0] == '\\0') trace_file = \"apple1_kb_trace.log\";\n        kb_trace_fp = fopen(trace_file, \"a\");\n    }\n}\nuint64_t now = cpu->total_cycles;\nif ((now - comp->last_event_poll_cycle) < 2048u) return;\ncomp->last_event_poll_cycle = now;\nCPUHostEvent ev;\nwhile (cpu_host_hal_poll_event(&ev)) {\n    if (cpu_host_hal_event_type(&ev) == CPU_HOST_EVENT_QUIT) {\n        cpu->running = false;\n        cpu->halted = true;\n    } else if (cpu_host_hal_event_type(&ev) == CPU_HOST_EVENT_KEYDOWN || cpu_host_hal_event_type(&ev) == CPU_HOST_EVENT_KEYUP) {\n        if (kb_trace != 0 && kb_trace_fp != NULL) {\n            int32_t sc = cpu_host_hal_event_scancode(&ev);\n            fprintf(\n                kb_trace_fp,\n                \"apple1-kb event=%s sc=%d name=%s repeat=%u focus=%u\\n\",\n                (cpu_host_hal_event_type(&ev) == CPU_HOST_EVENT_KEYDOWN) ? \"down\" : \"up\",\n                (int)sc,\n                cpu_host_hal_scancode_name(sc),\n                (unsigned)cpu_host_hal_event_key_repeat(&ev),\n                (unsigned)comp->has_keyboard_focus\n            );\n            fflush(kb_trace_fp);\n        }\n    }\n}\ncpu_host_hal_pump_events();\ncomp->has_keyboard_focus = cpu_host_hal_window_has_focus(comp->window);\nif (comp->has_keyboard_focus != comp->last_focus_state) {\n    comp->last_focus_state = comp->has_keyboard_focus;\n    if (comp->window != NULL) {\n        cpu_host_hal_set_window_title(comp->window, CPU_SYSTEM_TITLE);\n    }\n}\n{\n    pasm_overlay_update_perf(\n        cpu_host_hal_ticks(),\n        cpu->total_cycles,\n        comp->overlay_last_ms,\n        comp->overlay_last_frame_count,\n        comp->overlay_last_cycle_count,\n        &comp->overlay_fps_x100,\n        &comp->overlay_cpu_hz,\n        &comp->overlay_cpu_pct_x10\n    );\n}\n"
    destroy: "if (comp->audio_out_dev != 0u) {\n    cpu_host_hal_audio_close(comp->audio_out_dev);\n    comp->audio_out_dev = 0u;\n}\nif (comp->audio_ring != NULL) {\n    cpu_host_hal_free(comp->audio_ring);\n    comp->audio_ring = NULL;\n}\ncomp->audio_ring_capacity = 0u;\ncomp->audio_ring_read_idx = 0u;\ncomp->audio_ring_write_idx = 0u;\ncomp->audio_ring_fill = 0u;\ncomp->audio_device_samples = 0u;\ncomp->audio_channels = 0u;\nif (comp->display_shader != NULL) {\n    cpu_host_hal_shader_destroy(comp->display_shader);\n    comp->display_shader = NULL;\n}\ncomp->display_shader_supported = -1;\nif (comp->texture != NULL) {\n    cpu_host_hal_destroy_texture(comp->texture);\n    comp->texture = NULL;\n}\nif (comp->renderer != NULL) {\n    cpu_host_hal_destroy_renderer(comp->renderer);\n    comp->renderer = NULL;\n}\nif (comp->window != NULL) {\n    cpu_host_hal_destroy_window(comp->window);\n    comp->window = NULL;\n}\nif (comp->host_inited != 0u) {\n    cpu_host_hal_stop_text_input();\n    cpu_host_hal_quit_subsystems();\n    cpu_host_hal_quit();\n    comp->host_inited = 0u;\n}\n"
  callback_handlers:
    keyboard_ascii: "return cpu_host_hal_pop_ascii();\n"
  handler_bodies:
    video_frame: "if (comp->host_inited == 0u || argc < 4) return;\nvoid *renderer = comp->renderer;\nvoid *texture = comp->texture;\nuint32_t frame = (uint32_t)(args[0] & 0xFFFFFFFFu);\nuint32_t *pixels = (uint32_t *)(uintptr_t)args[1];\nuint32_t w = (uint32_t)(args[2] & 0xFFFFFFFFu);\nuint32_t h = (uint32_t)(args[3] & 0xFFFFFFFFu);\nif (renderer == NULL || texture == NULL || pixels == NULL || w == 0u || h == 0u) return;\ncomp->frame_count = frame;\nif (cpu->debug_overlay_enabled) {\n    pasm_overlay_draw_perf(\n        pixels,\n        w,\n        h,\n        comp->overlay_fps_x100,\n        comp->overlay_cpu_hz,\n        comp->overlay_cpu_pct_x10\n    );\n}\nif (comp->texture_w != w || comp->texture_h != h) {\n    cpu_host_hal_destroy_texture(texture);\n    texture = cpu_host_hal_create_texture(renderer, CPU_HOST_PIXELFORMAT_ARGB8888, CPU_HOST_TEXTUREACCESS_STREAMING, (int)w, (int)h);\n    if (texture == NULL) return;\n    comp->texture = (void *)texture;\n    comp->texture_w = w;\n    comp->texture_h = h;\n}\nif (comp->display_shader_supported < 0) {\n    comp->display_shader_supported = (comp->display_shader != NULL && cpu_host_hal_renderer_supports_shaders(renderer) != 0) ? 1 : 0;\n}\nint shader_ready = (comp->display_shader_supported != 0) ? 1 : 0;\nif (shader_ready == 0) {\n    uint64_t shader_count = (uint64_t)w * (uint64_t)h;\n    for (uint64_t shader_i = 0u; shader_i < shader_count; ++shader_i) {\n        uint32_t px = pixels[shader_i];\n        uint32_t r = (px >> 16u) & 0xFFu;\n        uint32_t g = (px >> 8u) & 0xFFu;\n        uint32_t b = px & 0xFFu;\n        uint32_t luma = (r * 30u + g * 59u + b * 11u) / 100u;\n        uint32_t green = (luma > 255u) ? 255u : luma;\n        pixels[shader_i] = 0xFF000000u | (green << 8u);\n    }\n}\nif (cpu_host_hal_update_texture(texture, NULL, pixels, (int)(w * sizeof(uint32_t))) != 0) return;\ncpu_host_hal_render_set_draw_color(renderer, 0, 0, 0, 255);\ncpu_host_hal_render_clear(renderer);\n{\n    int ww = 0;\n    int hh = 0;\n    cpu_host_hal_get_window_size(comp->window, &ww, &hh);\n    float aspect = (float)w / (float)h;\n    int draw_w = ww;\n    int draw_h = (int)((float)ww / aspect);\n    if (draw_h > hh) {\n        draw_h = hh;\n        draw_w = (int)((float)hh * aspect);\n    }\n    int draw_x = (ww - draw_w) / 2;\n    int draw_y = (hh - draw_h) / 2;\n    if (shader_ready != 0) {\n        cpu_host_hal_render_shader(comp->display_shader, texture, draw_x, draw_y, draw_w, draw_h, (float)cpu_host_hal_ticks() / 1000.0f);\n    } else {\n        cpu_host_hal_render_copy(renderer, texture, NULL, draw_x, draw_y, draw_w, draw_h);\n    }\n}\ncpu_host_hal_render_present(renderer);\n"
    audio_pcm: "if (comp->audio_out_dev == 0u || comp->audio_out_ready == 0u || comp->audio_ring == NULL || comp->audio_ring_capacity == 0u || argc < 1) return;\nuint8_t level_u = (uint8_t)(args[0] & 0xFFu); /* 1-bit beeper level: 0 or 255 */\nuint64_t cycle = (argc > 1) ? (uint64_t)args[1] : cpu->total_cycles;\nuint64_t sample_rate = (comp->audio_rate > 0u) ? (uint64_t)comp->audio_rate : ((CPU_AUDIO_SAMPLE_RATE > 0u) ? CPU_AUDIO_SAMPLE_RATE : 44100u);\nuint64_t clock_hz = (CPU_SYSTEM_CLOCK_HZ > 0u) ? CPU_SYSTEM_CLOCK_HZ : 1u;\nuint64_t target_sample_index = (cycle * sample_rate) / clock_hz;\nint16_t next_level = (level_u != 0u) ? 9000 : -9000;\n\nif (comp->audio_last_cycle == 0u && comp->audio_sample_cursor == 0u && comp->audio_samples == 0u) {\n    comp->audio_last_cycle = cycle;\n    comp->audio_sample_cursor = target_sample_index;\n    comp->audio_level = next_level;\n    return;\n}\n\nif (target_sample_index < comp->audio_sample_cursor) {\n    comp->audio_sample_cursor = target_sample_index;\n}\n{\n    uint64_t samples_to_emit = target_sample_index - comp->audio_sample_cursor;\n    while (samples_to_emit > 0) {\n        uint32_t write_idx = comp->audio_ring_write_idx;\n        comp->audio_ring[write_idx] = comp->audio_level;\n        comp->audio_ring_write_idx = (write_idx + 1u) % comp->audio_ring_capacity;\n        if (comp->audio_ring_fill < comp->audio_ring_capacity) {\n            comp->audio_ring_fill++;\n        } else {\n            comp->audio_ring_read_idx = (comp->audio_ring_read_idx + 1u) % comp->audio_ring_capacity;\n        }\n        comp->audio_sample_cursor++;\n        samples_to_emit--;\n    }\n    comp->audio_level = next_level;\n}\n\nwhile (comp->audio_ring_fill >= 1024u) {\n    int16_t buf[1024];\n    for (uint32_t i = 0u; i < 1024u; ++i) {\n        uint32_t read_idx = comp->audio_ring_read_idx;\n        buf[i] = comp->audio_ring[read_idx];\n        comp->audio_ring_read_idx = (read_idx + 1u) % comp->audio_ring_capacity;\n    }\n    comp->audio_ring_fill -= 1024u;\n    cpu_host_hal_audio_write(comp->audio_out_dev, buf, 1024);\n    comp->audio_samples += 1024u;\n}\n"
coding:
  headers:
  - pasm_overlay.h
  include_paths:
  - ../include