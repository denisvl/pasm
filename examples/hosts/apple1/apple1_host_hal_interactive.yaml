behavior:
  snippets:
    init: "do {\n    if (comp->host_inited != 0u) break;\n    if (cpu_host_hal_init(CPU_HOST_INIT_VIDEO | CPU_HOST_INIT_EVENTS) != 0) break;\n    comp->window = cpu_host_hal_create_window(CPU_SYSTEM_TITLE, CPU_HOST_WINDOWPOS_CENTERED, CPU_HOST_WINDOWPOS_CENTERED, 560, 384, CPU_HOST_WINDOW_RESIZABLE);\n    if (comp->window != NULL) {\n        comp->renderer = cpu_host_hal_create_renderer(comp->window, -1, CPU_HOST_RENDERER_ACCELERATED);\n        if (comp->renderer == NULL) comp->renderer = cpu_host_hal_create_renderer(comp->window, -1, 0);\n        if (comp->renderer != NULL) {\n            comp->texture = cpu_host_hal_create_texture(comp->renderer, CPU_HOST_PIXELFORMAT_ARGB8888, CPU_HOST_TEXTUREACCESS_STREAMING, 560, 384);\n            comp->texture_w = 560u;\n            comp->texture_h = 384u;\n        }\n    }\n    cpu_host_hal_start_text_input();\n    comp->host_inited = 1u;\n} while (0);\n"
    reset: "comp->frame_count = 0u;\ncomp->audio_samples = 0u;\ncomp->audio_level = 0;\ncomp->audio_last_cycle = 0u;\ncomp->audio_sample_cursor = 0u;\ncomp->audio_ring_read_idx = 0u;\ncomp->audio_ring_write_idx = 0u;\ncomp->audio_ring_fill = 0u;\ncomp->last_event_poll_cycle = 0u;\ncomp->last_key_scancode = -1;\ncomp->overlay_last_ms = 0u;\ncomp->overlay_last_frame_count = 0u;\ncomp->overlay_last_cycle_count = 0u;\ncomp->overlay_fps_x100 = 0u;\ncomp->overlay_cpu_hz = 0u;\ncomp->overlay_cpu_pct_x10 = 0u;\nif (comp->audio_out_dev != 0u) {\n    cpu_host_hal_audio_clear(comp->audio_out_dev);\n}\ncomp->display_shader_supported = (comp->display_shader != NULL) ? -1 : 0;\n"
    step_post: "if (comp->host_inited == 0u) return;
cpu_host_hal_pump_events();
comp->has_keyboard_focus = (comp->window != NULL && cpu_host_hal_window_has_focus(comp->window)) ? 1u : 0u;
if (comp->has_keyboard_focus != comp->last_focus_state) {
    comp->last_focus_state = comp->has_keyboard_focus;
    if (comp->window != NULL) {
        cpu_host_hal_set_window_title(comp->window, CPU_SYSTEM_TITLE);
    }
}
cpu_component_host_picker_step(cpu, 1u);
{
    static int trace_init = -1;
    static FILE *trace_fp = NULL;
    const char *trace_env = cpu_host_hal_getenv(\"PASM_APPLE1_HOST_KEY_TRACE\");
    int trace_on = (trace_env != NULL && trace_env[0] != 0 && trace_env[0] != '0') ? 1 : 0;
    if (trace_init < 0) {
        trace_init = 1;
        if (trace_on != 0) {
            const char *trace_path = cpu_host_hal_getenv(\"PASM_APPLE1_HOST_KEY_TRACE_FILE\");
            if (trace_path != NULL && trace_path[0] != 0) trace_fp = fopen(trace_path, \"a\");
            if (trace_fp == NULL) trace_fp = stderr;
        }
    }
    CPUHostEvent ev;
    while (cpu_host_hal_poll_event(&ev)) {
        uint32_t ev_type = cpu_host_hal_event_type(&ev);
        if (trace_on != 0) {
            int32_t sc_trace = cpu_host_hal_event_scancode(&ev);
            fprintf(trace_fp, \"apple1_host ev_type=%u sc=%d repeat=%u focus=%u\\n\",
                (unsigned)ev_type,
                (int)sc_trace,
                (unsigned)cpu_host_hal_event_key_repeat(&ev),
                (unsigned)comp->has_keyboard_focus);
            fflush(trace_fp);
        }
        if (ev_type == CPU_HOST_EVENT_QUIT) {
            cpu->running = false;
            cpu->halted = true;
            return;
        }
        if (ev_type != CPU_HOST_EVENT_KEYDOWN) continue;
        if (cpu_host_hal_event_key_repeat(&ev) != 0u) continue;
        {
            int key_count = 0;
            const uint8_t *ks = cpu_host_hal_keyboard_state(&key_count);
            if (trace_on != 0) {
                int32_t sc_trace = cpu_host_hal_event_scancode(&ev);
                fprintf(trace_fp, \"apple1_host keydown sc=%d key_count=%d ks=%s\\n\",
                    (int)sc_trace,
                    key_count,
                    (ks != NULL) ? \"yes\" : \"no\");
                fflush(trace_fp);
            }
            if (ks == NULL || key_count <= 0) continue;
            cpu_component_keyboard_ascii_feed(cpu_host_hal_event_scancode(&ev), ks, (size_t)key_count, 1u);
            comp->last_key_scancode = cpu_host_hal_event_scancode(&ev);
        }
    }
}
"
    destroy: "if (comp->audio_out_dev != 0u) {\n    cpu_host_hal_audio_close(comp->audio_out_dev);\n    comp->audio_out_dev = 0u;\n}\nif (comp->audio_ring != NULL) {\n    cpu_host_hal_free(comp->audio_ring);\n    comp->audio_ring = NULL;\n}\ncomp->audio_ring_capacity = 0u;\ncomp->audio_ring_read_idx = 0u;\ncomp->audio_ring_write_idx = 0u;\ncomp->audio_ring_fill = 0u;\ncomp->audio_device_samples = 0u;\ncomp->audio_channels = 0u;\nif (comp->display_shader != NULL) {\n    cpu_host_hal_shader_destroy(comp->display_shader);\n    comp->display_shader = NULL;\n}\ncomp->display_shader_supported = -1;\nif (comp->texture != NULL) {\n    cpu_host_hal_destroy_texture(comp->texture);\n    comp->texture = NULL;\n}\nif (comp->renderer != NULL) {\n    cpu_host_hal_destroy_renderer(comp->renderer);\n    comp->renderer = NULL;\n}\nif (comp->window != NULL) {\n    cpu_host_hal_destroy_window(comp->window);\n    comp->window = NULL;\n}\nif (comp->host_inited != 0u) {\n    cpu_host_hal_stop_text_input();\n    cpu_host_hal_quit_subsystems();\n    cpu_host_hal_quit();\n    comp->host_inited = 0u;\n}\n"
  callback_handlers:
    keyboard_ascii: "{
uint8_t out = cpu_component_keyboard_ascii_pop();
if (out == 0u) return 0u;
if (out >= 'a' && out <= 'z') out = (uint8_t)(out - ('a' - 'A'));
return (uint64_t)(out | 0x80u);
}
"
  handler_bodies:
    video_frame: "if (comp->host_inited == 0u || argc < 4u) return;\nvoid *renderer = comp->renderer;\nvoid *texture = comp->texture;\nuint32_t frame = (uint32_t)(args[0] & 0xFFFFFFFFu);\nuint32_t *pixels = (uint32_t *)(uintptr_t)args[1];\nuint32_t w = (uint32_t)(args[2] & 0xFFFFFFFFu);\nuint32_t h = (uint32_t)(args[3] & 0xFFFFFFFFu);\nif (renderer == NULL || texture == NULL || pixels == NULL || w == 0u || h == 0u) return;\ncomp->frame_count = frame;\nif (cpu->debug_overlay_enabled) {\n    pasm_overlay_draw_perf(\n        pixels,\n        w,\n        h,\n        comp->overlay_fps_x100,\n        comp->overlay_cpu_hz,\n        comp->overlay_cpu_pct_x10\n    );\n}\nif (comp->texture_w != w || comp->texture_h != h) {\n    cpu_host_hal_destroy_texture(texture);\n    texture = cpu_host_hal_create_texture(renderer, CPU_HOST_PIXELFORMAT_ARGB8888, CPU_HOST_TEXTUREACCESS_STREAMING, (int)w, (int)h);\n    if (texture == NULL) return;\n    comp->texture = texture;\n    comp->texture_w = w;\n    comp->texture_h = h;\n}\nif (cpu_host_hal_update_texture(texture, NULL, pixels, (int)(w * sizeof(uint32_t))) != 0) return;\ncpu_host_hal_render_set_draw_color(renderer, 0, 0, 0, 255);\ncpu_host_hal_render_clear(renderer);\n{\n    int ww = 0;\n    int wh = 0;\n    CPUHostRect dst;\n    if (cpu_host_hal_renderer_output_size(renderer, &ww, &wh) != 0 || ww <= 0 || wh <= 0) return;\n    dst.w = ww;\n    dst.h = wh;\n    dst.x = 0;\n    dst.y = 0;\n    if (cpu_host_hal_render_copy(renderer, texture, NULL, &dst) != 0) return;\n}\ncpu_host_hal_render_present(renderer);\n"
    audio_pcm: "(void)cpu;\n(void)comp;\n(void)args;\n(void)argc;\nreturn;\n"
coding:
  headers:
  - stdio.h
  - pasm_overlay.h
  include_paths:
  - ../include
  linked_libraries: []
  library_paths: []
