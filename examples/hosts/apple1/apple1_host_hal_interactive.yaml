- name: host_inited
  type: uint8_t
  initial: '0'
- name: window
  type: void *
  initial: 'NULL'
- name: renderer
  type: void *
  initial: 'NULL'
- name: texture
  type: void *
  initial: 'NULL'
- name: display_shader
  type: void *
  initial: 'NULL'
- name: display_shader_supported
  type: int32_t
  initial: '-1'
- name: texture_w
  type: uint32_t
  initial: '560'
- name: texture_h
  type: uint32_t
  initial: '384'
- name: audio_out_dev
  type: uint32_t
  initial: '0'
- name: audio_out_ready
  type: uint8_t
  initial: '0'
- name: audio_device_samples
  type: uint32_t
  initial: '0'
- name: frame_count
  type: uint32_t
  initial: '0'
- name: audio_samples
  type: uint32_t
  initial: '0'
- name: audio_level
  type: int16_t
  initial: '0'
- name: audio_last_cycle
  type: uint64_t
  initial: '0'
- name: audio_sample_cursor
  type: uint64_t
  initial: '0'
- name: audio_rate
  type: uint32_t
  initial: '0'
- name: audio_channels
  type: uint32_t
  initial: '0'
- name: audio_ring
  type: int16_t *
  initial: 'NULL'
- name: audio_ring_capacity
  type: uint32_t
  initial: '0'
- name: audio_ring_read_idx
  type: uint32_t
  initial: '0'
- name: audio_ring_write_idx
  type: uint32_t
  initial: '0'
- name: audio_ring_fill
  type: uint32_t
  initial: '0'
- name: has_keyboard_focus
  type: uint8_t
  initial: '0'
- name: last_focus_state
  type: uint8_t
  initial: '0'
- name: last_event_poll_cycle
  type: uint64_t
  initial: '0'
