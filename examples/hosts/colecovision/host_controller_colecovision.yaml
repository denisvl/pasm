controller_map:
  focus_required: true
  ports:
  - port: 1
    connected: true
    host_device:
      kind: any
  - port: 2
    connected: false
    host_device:
      kind: any
  bindings:
  # Player 1 joystick (D-pad)
  - target_control_id: P1_UP
    host_scancode: UP
  - target_control_id: P1_DOWN
    host_scancode: DOWN
  - target_control_id: P1_LEFT
    host_scancode: LEFT
  - target_control_id: P1_RIGHT
    host_scancode: RIGHT
  # Player 1 fire buttons
  - target_control_id: P1_B1
    host_scancode: A
  - target_control_id: P1_B2
    host_scancode: S
  # Player 1 keypad (12-key numeric keypad)
  - target_control_id: P1_KP_1
    host_scancode: 1
  - target_control_id: P1_KP_2
    host_scancode: 2
  - target_control_id: P1_KP_3
    host_scancode: 3
  - target_control_id: P1_KP_4
    host_scancode: 4
  - target_control_id: P1_KP_5
    host_scancode: 5
  - target_control_id: P1_KP_6
    host_scancode: 6
  - target_control_id: P1_KP_7
    host_scancode: 7
  - target_control_id: P1_KP_8
    host_scancode: 8
  - target_control_id: P1_KP_9
    host_scancode: 9
  - target_control_id: P1_KP_STAR
    host_scancode: MINUS
  - target_control_id: P1_KP_0
    host_scancode: 0
  - target_control_id: P1_KP_HASH
    host_scancode: EQUALS
  # Player 2 joystick (numpad keys)
  - target_control_id: P2_UP
    host_scancode: KP_8
  - target_control_id: P2_DOWN
    host_scancode: KP_2
  - target_control_id: P2_LEFT
    host_scancode: KP_4
  - target_control_id: P2_RIGHT
    host_scancode: KP_6
  - target_control_id: P2_B1
    host_scancode: KP_1
  - target_control_id: P2_B2
    host_scancode: KP_3
  # Gamepad bindings for P1 joystick
  - target_control_id: P1_UP
    host_gamepad:
      device: any
      control: 'dpad_up'
  - target_control_id: P1_DOWN
    host_gamepad:
      device: any
      control: 'dpad_down'
  - target_control_id: P1_LEFT
    host_gamepad:
      device: any
      control: 'dpad_left'
  - target_control_id: P1_RIGHT
    host_gamepad:
      device: any
      control: 'dpad_right'
  - target_control_id: P1_UP
    host_gamepad:
      device: any
      control: 'left_y'
  - target_control_id: P1_DOWN
    host_gamepad:
      device: any
      control: 'left_y'
  - target_control_id: P1_LEFT
    host_gamepad:
      device: any
      control: 'left_x'
  - target_control_id: P1_RIGHT
    host_gamepad:
      device: any
      control: 'left_x'
  - target_control_id: P1_B1
    host_gamepad:
      device: any
      control: 'a'
  - target_control_id: P1_B2
    host_gamepad:
      device: any
      control: 'b'
  # Joystick bindings for P1
  - target_control_id: P1_UP
    host_joystick:
      device: any
      hat: 0
      hat_dir: 'up'
  - target_control_id: P1_DOWN
    host_joystick:
      device: any
      hat: 0
      hat_dir: 'down'
  - target_control_id: P1_LEFT
    host_joystick:
      device: any
      hat: 0
      hat_dir: 'left'
  - target_control_id: P1_RIGHT
    host_joystick:
      device: any
      hat: 0
      hat_dir: 'right'
  - target_control_id: P1_B1
    host_joystick:
      device: any
      button: 0
  - target_control_id: P1_B2
    host_joystick:
      device: any
      button: 1
