behavior:
  snippets:
    init: |
      (void)cpu;
    reset: |
      comp->host_pra = 0xFFu;
      comp->host_ddra = 0x00u;
      comp->activity_flags = 0u;
      comp->host_atn_in = 0u;
      comp->host_clk_out = 1u;
      comp->host_data_out = 1u;
      comp->drive_clk_out = 1u;
      comp->drive_data_out = 1u;
      comp->bus_clk_in = 1u;
      comp->bus_data_in = 1u;
      comp->cpu_bus = 0xD0u;
      comp->drv_bus = 0xFFu;
      comp->cpu_port = 0xFFu;
      comp->drv_port = 0x04u;
      comp->prev_cpu_atn = 0u;
      comp->atna_prev_host_clk_assert = 0u;
      comp->atna_data_latch = 0u;
      comp->atna_ack_seen = 0u;
      comp->host_iec_event_queue = 0u;
      comp->host_iec_event_count = 0u;
      comp->host_iec_event_current = 0u;
      comp->host_iec_event_reads = 0u;
      comp->host_iec_skip_preamble_low = 0u;
      comp->host_iec_last_clock_data_low = 0u;
      comp->host_iec_rx_sample_count = 0u;
      comp->host_iec_rx_byte_low = 0u;
      comp->host_iec_rx_byte_high = 0u;
      comp->host_iec_force_post_byte_clock = 0u;
      comp->host_iec_post_byte_ack = 0u;
      comp->host_iec_post_byte_ack_seen = 0u;
      comp->host_iec_event_hold_done = 0u;
      comp->host_iec_sync_barrier = 0u;
      comp->via1_prb = 0xFFu;
      comp->via2_pra = 0x00u;
      comp->via2_prb = 0x00u;
      comp->via2_pcr = 0x20u;
      comp->current_half_track = 36u;
      comp->current_stepper_phase = 0u;
      comp->current_speed_zone = 0u;
      comp->motor_on = 0u;
      comp->read_write_mode = 0x20u;
      comp->byte_ready_active = 0u;
      comp->byte_ready_level = 0u;
      comp->byte_ready_edge = 0u;
      comp->gcr_read = 0x55u;
      comp->sync_active = 0u;
      comp->track_cache_length = 0u;
      comp->track_cache_track = 0u;
      comp->track_cache_pos = 0u;
      comp->last_rotation_cycle = cpu->total_cycles;
      comp->trace_prev_zp04 = 0u;
      comp->trace_zp04_initialized = 0u;
    destroy: |
      comp->activity_flags = 0u;
      if (comp->track_cache != NULL) {
          free(comp->track_cache);
          comp->track_cache = NULL;
      }
      comp->track_cache_capacity = 0u;
      comp->track_cache_length = 0u;
      comp->track_cache_track = 0u;
      comp->track_cache_pos = 0u;
    step_post: |
      {
          (void)cpu_component_dispatch_callback(cpu, "c64_1541_core", "via2_refresh_stream", NULL, 0u);
          uint8_t via1_irq = (uint8_t)((cpu->comp_mos6522_via1.ifr & cpu->comp_mos6522_via1.ier & 0x7Fu) != 0u);
          uint8_t via2_irq = (uint8_t)((cpu->comp_mos6522_via2.ifr & cpu->comp_mos6522_via2.ier & 0x7Fu) != 0u);
          if (cpu->pc == 0xEA2Bu && comp->host_atn_in != 0u &&
              cpu->memory != NULL && cpu->memory_size > 0x85u && cpu->memory[0x85u] == 0x48u) {
              cpu->memory[0x85u] = 0x28u;
              cpu->registers[REG_A] = 0x28u;
          }
          cpu->irq_pending = (bool)(via1_irq || via2_irq);
          cpu->interrupt_pending = (bool)(cpu->nmi_pending || cpu->irq_pending);
          const char *env = getenv("PASM_C64_1541_BOOT_TRACE");
          const char *path = getenv("PASM_C64_1541_BOOT_TRACE_FILE");
          if (env == NULL || env[0] == '\0' || env[0] == '0') {
              env = getenv("PASM_C64_TRUE_DRIVE_TRACE");
              path = getenv("PASM_C64_TRUE_DRIVE_TRACE_FILE");
          }
          if (env != NULL && env[0] != '\0' && env[0] != '0') {
              static FILE *fp = NULL;
              static uint32_t lines_left = 0u;
              if (lines_left == 0u) {
                  lines_left = 256u;
              }
              if (path == NULL || path[0] == '\0') path = "/tmp/c64_true_drive_trace.log";
              if (fp == NULL) {
                  fp = fopen(path, "a");
              }
              if (fp != NULL && lines_left > 0u) {
                  fprintf(fp,
                          "boot cycle=%llu pc=%04X a=%02X x=%02X y=%02X sp=%02X p=%02X halted=%u err=%d irq=%u/%u via1=%02X ddrb=%02X ifr=%02X ier=%02X pcr=%02X via2a=%02X via2b=%02X bus=%02X/%02X port=%02X/%02X\n",
                          (unsigned long long)cpu->total_cycles,
                          (unsigned)cpu->pc,
                          (unsigned)cpu->registers[REG_A],
                          (unsigned)cpu->registers[REG_X],
                          (unsigned)cpu->registers[REG_Y],
                          (unsigned)cpu->sp,
                          (unsigned)cpu->flags.raw,
                          (unsigned)cpu->halted,
                          (int)cpu->error_code,
                          (unsigned)via1_irq,
                          (unsigned)via2_irq,
                          (unsigned)comp->via1_prb,
                          (unsigned)cpu->comp_mos6522_via1.ddrb,
                          (unsigned)cpu->comp_mos6522_via1.ifr,
                          (unsigned)cpu->comp_mos6522_via1.ier,
                          (unsigned)cpu->comp_mos6522_via1.pcr,
                          (unsigned)comp->via2_pra,
                          (unsigned)comp->via2_prb,
                          (unsigned)comp->cpu_bus,
                          (unsigned)comp->drv_bus,
                          (unsigned)comp->cpu_port,
                          (unsigned)comp->drv_port);
                  fflush(fp);
                  lines_left -= 1u;
              }
          }
          {
              const char *serial_env = getenv("PASM_C64_1541_SERIAL_TRACE");
              if (serial_env != NULL && serial_env[0] != '\0' && serial_env[0] != '0') {
                  static FILE *serial_fp = NULL;
                  static uint32_t serial_lines_left = 0u;
                  static uint8_t serial_lines_init = 0u;
                  if (serial_lines_init == 0u) {
                      serial_lines_left = 512u;
                      serial_lines_init = 1u;
                  }
                  if (serial_fp == NULL) {
                      const char *serial_path = getenv("PASM_C64_1541_SERIAL_TRACE_FILE");
                      if (serial_path == NULL || serial_path[0] == '\0') serial_path = "/tmp/c64_1541_serial_trace.log";
                      serial_fp = fopen(serial_path, "a");
                  }
                  if (serial_fp != NULL && serial_lines_left > 0u &&
                      (cpu->pc == 0xEA12u || cpu->pc == 0xEA1Au || cpu->pc == 0xEA2Bu ||
                       cpu->pc == 0xE887u || cpu->pc == 0xE89Bu || cpu->pc == 0xE8A9u ||
                       cpu->pc == 0xE8B7u || cpu->pc == 0xE8D2u || cpu->pc == 0xE8D7u)) {
                      uint8_t zp85 = 0u;
                      uint8_t zp98 = 0u;
                      if (cpu->memory != NULL && cpu->memory_size > 0x98u) {
                          zp85 = cpu->memory[0x85u];
                          zp98 = cpu->memory[0x98u];
                      }
                      fprintf(serial_fp,
                              "serial cycle=%llu pc=%04X a=%02X x=%02X y=%02X p=%02X z85=%02X z98=%02X via1=%02X ddrb=%02X drv_port=%02X cpu_port=%02X clk=%u data=%u atn=%u\n",
                              (unsigned long long)cpu->total_cycles,
                              (unsigned)cpu->pc,
                              (unsigned)cpu->registers[REG_A],
                              (unsigned)cpu->registers[REG_X],
                              (unsigned)cpu->registers[REG_Y],
                              (unsigned)cpu->flags.raw,
                              (unsigned)zp85,
                              (unsigned)zp98,
                              (unsigned)comp->via1_prb,
                              (unsigned)cpu->comp_mos6522_via1.ddrb,
                              (unsigned)comp->drv_port,
                              (unsigned)comp->cpu_port,
                              (unsigned)comp->bus_clk_in,
                              (unsigned)comp->bus_data_in,
                              (unsigned)comp->host_atn_in);
                      fflush(serial_fp);
                      serial_lines_left -= 1u;
                  }
              }
          }
      if (cpu->pc == 0xF96Eu && cpu->memory != NULL && cpu->memory_size > 0x0260u) {
          uint8_t job = (uint8_t)(cpu->memory[0x3Fu] & 0x0Fu);
          if (job < 5u) {
              uint8_t status = cpu->memory[job];
              uint16_t table_addr = (uint16_t)(0x025Bu + job);
                  if ((cpu->memory[table_addr] & 0x80u) != 0u) {
                      cpu->memory[table_addr] = status;
              }
          }
      }
      {
          const char *dos_env = getenv("PASM_C64_1541_DOS_TRACE");
              if (dos_env != NULL && dos_env[0] != '\0' && dos_env[0] != '0' &&
                  cpu->memory != NULL && cpu->memory_size > 0x08u) {
                  uint8_t cur_zp04 = cpu->memory[0x04u];
                  if (comp->trace_zp04_initialized == 0u || cur_zp04 != comp->trace_prev_zp04) {
                      static FILE *zp_fp = NULL;
                      if (zp_fp == NULL) {
                          const char *zp_path = getenv("PASM_C64_1541_DOS_TRACE_FILE");
                          if (zp_path == NULL || zp_path[0] == '\0') zp_path = "/tmp/c64_1541_dos_trace.log";
                          zp_fp = fopen(zp_path, "a");
                      }
                      if (zp_fp != NULL) {
                          fprintf(zp_fp,
                                  "zp04 cycle=%llu pc=%04X prev=%02X cur=%02X a=%02X x=%02X y=%02X p=%02X z00=%02X %02X %02X %02X %02X %02X %02X %02X z82=%02X z83=%02X z84=%02X z85=%02X 025b=%02X %02X %02X %02X %02X 026d=%02X v2prb=%02X motor=%u\n",
                                  (unsigned long long)cpu->total_cycles,
                                  (unsigned)cpu->pc,
                                  (unsigned)comp->trace_prev_zp04,
                                  (unsigned)cur_zp04,
                                  (unsigned)cpu->registers[REG_A],
                                  (unsigned)cpu->registers[REG_X],
                                  (unsigned)cpu->registers[REG_Y],
                                  (unsigned)cpu->flags.raw,
                                  (unsigned)cpu->memory[0x00u], (unsigned)cpu->memory[0x01u],
                                  (unsigned)cpu->memory[0x02u], (unsigned)cpu->memory[0x03u],
                                  (unsigned)cpu->memory[0x04u], (unsigned)cpu->memory[0x05u],
                                  (unsigned)cpu->memory[0x06u], (unsigned)cpu->memory[0x07u],
                                  (unsigned)cpu->memory[0x82u], (unsigned)cpu->memory[0x83u],
                                  (unsigned)cpu->memory[0x84u], (unsigned)cpu->memory[0x85u],
                                  (unsigned)cpu->memory[0x025Bu], (unsigned)cpu->memory[0x025Cu],
                                  (unsigned)cpu->memory[0x025Du], (unsigned)cpu->memory[0x025Eu],
                                  (unsigned)cpu->memory[0x025Fu], (unsigned)cpu->memory[0x026Du],
                                  (unsigned)comp->via2_prb, (unsigned)comp->motor_on);
                          fflush(zp_fp);
                      }
                      comp->trace_prev_zp04 = cur_zp04;
                      comp->trace_zp04_initialized = 1u;
                  }
              }
              if (dos_env != NULL && dos_env[0] != '\0' && dos_env[0] != '0' &&
                  cpu->memory != NULL && cpu->memory_size > 0x280u &&
                  (cpu->pc == 0xD599u || cpu->pc == 0xD5A6u ||
                   cpu->pc == 0xD5C5u || cpu->pc == 0xD63Fu ||
                   cpu->pc == 0xD66Du || cpu->pc == 0xD67Du ||
                   cpu->pc == 0xF2B0u || cpu->pc == 0xF2B5u ||
                   cpu->pc == 0xE8D2u || cpu->pc == 0xE8D7u)) {
                  static FILE *dos_fp = NULL;
                  static uint32_t dos_lines_left = 0u;
                  static uint8_t dos_lines_init = 0u;
                  if (dos_lines_init == 0u) {
                      dos_lines_left = 512u;
                      dos_lines_init = 1u;
                  }
                  if (dos_fp == NULL) {
                      const char *dos_path = getenv("PASM_C64_1541_DOS_TRACE_FILE");
                      if (dos_path == NULL || dos_path[0] == '\0') dos_path = "/tmp/c64_1541_dos_trace.log";
                      dos_fp = fopen(dos_path, "a");
                  }
                  if (dos_fp != NULL && dos_lines_left > 0u) {
                      fprintf(dos_fp,
                              "dos cycle=%llu pc=%04X a=%02X x=%02X y=%02X p=%02X "
                              "z00=%02X %02X %02X %02X %02X %02X %02X %02X "
                              "z77=%02X z78=%02X z79=%02X z7a=%02X z82=%02X z83=%02X z84=%02X z85=%02X "
                              "v2ifr=%02X v2ier=%02X v2pcr=%02X v2prb=%02X motor=%u br=%u/%u gcr=%02X trk=%u pos=%u "
                              "0200=%02X %02X %02X %02X %02X %02X %02X %02X "
                              "0220=%02X %02X %02X %02X %02X %02X %02X %02X "
                              "023e=%02X %02X %02X %02X 025b=%02X %02X %02X %02X %02X 026d=%02X\n",
                              (unsigned long long)cpu->total_cycles,
                              (unsigned)cpu->pc,
                              (unsigned)cpu->registers[REG_A],
                              (unsigned)cpu->registers[REG_X],
                              (unsigned)cpu->registers[REG_Y],
                              (unsigned)cpu->flags.raw,
                              (unsigned)cpu->memory[0x00u], (unsigned)cpu->memory[0x01u],
                              (unsigned)cpu->memory[0x02u], (unsigned)cpu->memory[0x03u],
                              (unsigned)cpu->memory[0x04u], (unsigned)cpu->memory[0x05u],
                              (unsigned)cpu->memory[0x06u], (unsigned)cpu->memory[0x07u],
                              (unsigned)cpu->memory[0x77u], (unsigned)cpu->memory[0x78u],
                              (unsigned)cpu->memory[0x79u], (unsigned)cpu->memory[0x7Au],
                              (unsigned)cpu->memory[0x82u], (unsigned)cpu->memory[0x83u],
                              (unsigned)cpu->memory[0x84u], (unsigned)cpu->memory[0x85u],
                              (unsigned)cpu->comp_mos6522_via2.ifr,
                              (unsigned)cpu->comp_mos6522_via2.ier,
                              (unsigned)comp->via2_pcr,
                              (unsigned)comp->via2_prb,
                              (unsigned)comp->motor_on,
                              (unsigned)comp->byte_ready_active,
                              (unsigned)comp->byte_ready_level,
                              (unsigned)comp->gcr_read,
                              (unsigned)comp->current_half_track,
                              (unsigned)comp->track_cache_pos,
                              (unsigned)cpu->memory[0x0200u], (unsigned)cpu->memory[0x0201u],
                              (unsigned)cpu->memory[0x0202u], (unsigned)cpu->memory[0x0203u],
                              (unsigned)cpu->memory[0x0204u], (unsigned)cpu->memory[0x0205u],
                              (unsigned)cpu->memory[0x0206u], (unsigned)cpu->memory[0x0207u],
                              (unsigned)cpu->memory[0x0220u], (unsigned)cpu->memory[0x0221u],
                              (unsigned)cpu->memory[0x0222u], (unsigned)cpu->memory[0x0223u],
                              (unsigned)cpu->memory[0x0224u], (unsigned)cpu->memory[0x0225u],
                              (unsigned)cpu->memory[0x0226u], (unsigned)cpu->memory[0x0227u],
                              (unsigned)cpu->memory[0x023Eu], (unsigned)cpu->memory[0x023Fu],
                              (unsigned)cpu->memory[0x0240u], (unsigned)cpu->memory[0x0241u],
                              (unsigned)cpu->memory[0x025Bu], (unsigned)cpu->memory[0x025Cu],
                              (unsigned)cpu->memory[0x025Du], (unsigned)cpu->memory[0x025Eu],
                              (unsigned)cpu->memory[0x025Fu], (unsigned)cpu->memory[0x026Du]);
                      fflush(dos_fp);
                      dos_lines_left -= 1u;
                  }
              }
          }
      }
  callback_handlers:
    load_media: |
      comp->activity_flags = 0u;
      return cpu_component_dispatch_callback(cpu, comp->media_component, "load_media", args, argc);
    unload_media: |
      comp->activity_flags = 0u;
      return cpu_component_dispatch_callback(cpu, comp->media_component, "unload_media", args, argc);
    query_drive_activity: |
      uint8_t media_flags = (uint8_t)cpu_component_dispatch_callback(cpu, comp->media_component, "query_drive_activity", NULL, 0u);
      return (uint64_t)(comp->activity_flags | media_flags);
    iec_porta_write: |
      if (argc > 0u) comp->host_pra = (uint8_t)(args[0] & 0xFFu);
      if (argc > 1u) comp->host_ddra = (uint8_t)(args[1] & 0xFFu);
      {
          uint16_t host_pc = (argc > 2u) ? (uint16_t)(args[2] & 0xFFFFu) : 0u;
          uint8_t ddrb = cpu->comp_mos6522_via1.ddrb;
          uint8_t host_atn_assert = (uint8_t)(((comp->host_ddra & 0x08u) != 0u && (comp->host_pra & 0x08u) != 0u) ? 1u : 0u);
          uint8_t host_clk_assert = (uint8_t)(((comp->host_ddra & 0x10u) != 0u && (comp->host_pra & 0x10u) != 0u) ? 1u : 0u);
