                          comp->track_cache[pos++] = (uint8_t)((c6 << 5u) | c7);
                      }
                  }
                  for (n = 0u; n < 12u; ++n) comp->track_cache[pos++] = 0x55u;
              }
              comp->track_cache_length = pos;
              comp->track_cache_track = logical_track;
              comp->track_cache_pos = 0u;
              comp->gcr_read = 0x55u;
          }
          if (comp->motor_on == 0u || comp->track_cache_length == 0u) {
              comp->last_rotation_cycle = cpu->total_cycles;
              return 1u;
          }
          delta = (uint32_t)(cpu->total_cycles - comp->last_rotation_cycle);
          switch (comp->current_speed_zone & 0x03u) {
              case 0u: cycles_per_byte = 32u; break;
              case 1u: cycles_per_byte = 35u; break;
              case 2u: cycles_per_byte = 37u; break;
              default: cycles_per_byte = 40u; break;
          }
          bytes_to_advance = delta / cycles_per_byte;
          if (bytes_to_advance == 0u) return 1u;
          comp->last_rotation_cycle += (uint64_t)bytes_to_advance * (uint64_t)cycles_per_byte;
          for (i = 0u; i < bytes_to_advance; ++i) {
              uint8_t v = comp->track_cache[comp->track_cache_pos];
              comp->track_cache_pos += 1u;
              if (comp->track_cache_pos >= comp->track_cache_length) comp->track_cache_pos = 0u;
              if (v == 0xFFu) {
                  comp->sync_active = 1u;
              } else {
                  comp->sync_active = 0u;
                  comp->gcr_read = v;
                  if (comp->byte_ready_active != 0u) {
                      comp->byte_ready_edge = 1u;
                      comp->byte_ready_level = 1u;
                      cpu->comp_mos6522_via2.ifr = (uint8_t)(cpu->comp_mos6522_via2.ifr | 0x02u);
                      if ((cpu->comp_mos6522_via2.ifr & cpu->comp_mos6522_via2.ier & 0x7Fu) != 0u) cpu->comp_mos6522_via2.ifr = (uint8_t)(cpu->comp_mos6522_via2.ifr | 0x80u);
                      else cpu->comp_mos6522_via2.ifr = (uint8_t)(cpu->comp_mos6522_via2.ifr & 0x7Fu);
                  }
              }
              {
                  const char *stream_env = getenv("PASM_C64_1541_STREAM_TRACE");
                  if (stream_env != NULL && stream_env[0] != '\0' && stream_env[0] != '0') {
                      static FILE *stream_fp = NULL;
                      static uint32_t adv_lines_left = 0u;
                      static uint8_t adv_lines_init = 0u;
                      if (adv_lines_init == 0u) {
                          adv_lines_left = 768u;
                          adv_lines_init = 1u;
                      }
                      if (stream_fp == NULL) {
                          const char *stream_path = getenv("PASM_C64_1541_STREAM_TRACE_FILE");
                          if (stream_path == NULL || stream_path[0] == '\0') stream_path = "/tmp/c64_1541_stream_trace.log";
                          stream_fp = fopen(stream_path, "a");
                      }
                      if (stream_fp != NULL && adv_lines_left > 0u) {
                          fprintf(stream_fp,
                                  "adv cycle=%llu pc=%04X raw=%02X gcr=%02X sync=%u br=%u ifr=%02X ier=%02X half=%u cache_trk=%u pos=%u len=%u\n",
                                  (unsigned long long)cpu->total_cycles,
                                  (unsigned)cpu->pc,
                                  (unsigned)v,
                                  (unsigned)comp->gcr_read,
                                  (unsigned)comp->sync_active,
                                  (unsigned)comp->byte_ready_level,
                                  (unsigned)cpu->comp_mos6522_via2.ifr,
                                  (unsigned)cpu->comp_mos6522_via2.ier,
                                  (unsigned)comp->current_half_track,
                                  (unsigned)comp->track_cache_track,
                                  (unsigned)comp->track_cache_pos,
                                  (unsigned)comp->track_cache_length);
                          fflush(stream_fp);
                          adv_lines_left -= 1u;
                      }
                  }
              }
          }
          if (bytes_to_advance != 0u) comp->activity_flags |= 0x01u;
      }
      return 1u;
    kernal_load: |
      comp->activity_flags |= 0x01u;
      return cpu_component_dispatch_callback(cpu, comp->dos_component, "kernal_load", args, argc);
    kernal_iec_trap: |
      comp->activity_flags |= 0x01u;
      return cpu_component_dispatch_callback(cpu, comp->dos_component, "kernal_iec_trap", args, argc);
    kernal_file_trap: |
      comp->activity_flags |= 0x01u;
      return cpu_component_dispatch_callback(cpu, comp->dos_component, "kernal_file_trap", args, argc);
  handler_bodies: {}

