      return cpu_component_dispatch_callback(cpu, target, "query_true_drive_active", NULL, 0u);
    kernal_load: |
      const char *target = (comp->drive_component != NULL && comp->drive_component[0] != '\0') ? comp->drive_component : "c64_1541_core";
      return cpu_component_dispatch_callback(cpu, target, "kernal_load", args, argc);
    kernal_iec_trap: |
      const char *target = (comp->drive_component != NULL && comp->drive_component[0] != '\0') ? comp->drive_component : "c64_1541_core";
      return cpu_component_dispatch_callback(cpu, target, "kernal_iec_trap", args, argc);
    kernal_file_trap: |
      const char *target = (comp->drive_component != NULL && comp->drive_component[0] != '\0') ? comp->drive_component : "c64_1541_core";
