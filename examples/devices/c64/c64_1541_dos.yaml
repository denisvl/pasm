metadata:
  id: c64_1541_dos
  type: io_controller
  model: commodore_1541_dos
  version: "1.0"

state:
  - name: media_component
    type: char *
    initial: "\"c64_1541_media\""
  - name: command_mode
    type: uint8_t
    initial: "0"
  - name: listen_active
    type: uint8_t
    initial: "0"
  - name: talk_active
    type: uint8_t
    initial: "0"
  - name: last_secondary
    type: uint8_t
    initial: "0"
  - name: open_channel
    type: uint8_t
    initial: "0xFF"
  - name: write_channel
    type: uint8_t
    initial: "0xFF"
  - name: talk_channel
    type: uint8_t
    initial: "0xFF"
  - name: pending_name_len
    type: uint8_t
    initial: "0"
  - name: pending_name
    type: char *
    initial: "NULL"
  - name: current_name_channel
    type: uint8_t
    initial: "0xFF"
  - name: current_name_len
    type: uint8_t
    initial: "0"
  - name: current_name
    type: char *
    initial: "NULL"
  - name: read_buffer
    type: uint8_t *
    initial: "NULL"
  - name: read_size
    type: uint32_t
    initial: "0"
  - name: read_pos
    type: uint32_t
    initial: "0"
  - name: status_code
    type: uint8_t
    initial: "0"
  - name: status_track
    type: uint8_t
    initial: "0"
  - name: status_sector
    type: uint8_t
    initial: "0"
  - name: status_message
    type: char *
    initial: "NULL"
  - name: status_buffer
    type: char *
    initial: "NULL"
  - name: status_size
    type: uint32_t
    initial: "0"
  - name: status_pos
    type: uint32_t
    initial: "0"

interfaces:
  callbacks:
    - name: kernal_load
      args: []
      returns: u8
    - name: kernal_iec_trap
      args: [u16]
      returns: u8
    - name: kernal_file_trap
      args: [u16]
      returns: u8
    - name: handle_iec_byte
      args: [u8, u8]
      returns: u8
    - name: query_talk_active
      args: []
      returns: u8
    - name: read_talk_byte
      args: []
      returns: u16
  handlers: []
  signals: []

behavior:
  snippets:
    init: |
      (void)cpu;
    reset: |
      comp->command_mode = 0u;
      comp->listen_active = 0u;
      comp->talk_active = 0u;
      comp->last_secondary = 0u;
      comp->open_channel = 0xFFu;
      comp->write_channel = 0xFFu;
      comp->talk_channel = 0xFFu;
      comp->pending_name_len = 0u;
      if (comp->pending_name == NULL) comp->pending_name = (char *)calloc(64u, 1u);
      else memset(comp->pending_name, 0, 64u);
      comp->current_name_channel = 0xFFu;
      comp->current_name_len = 0u;
      if (comp->current_name == NULL) comp->current_name = (char *)calloc(64u, 1u);
      else memset(comp->current_name, 0, 64u);
      if (comp->read_buffer != NULL) {
          free(comp->read_buffer);
          comp->read_buffer = NULL;
      }
      comp->read_size = 0u;
      comp->read_pos = 0u;
      comp->status_code = 0u;
      comp->status_track = 0u;
      comp->status_sector = 0u;
      if (comp->status_message == NULL) comp->status_message = (char *)calloc(32u, 1u);
      if (comp->status_buffer == NULL) comp->status_buffer = (char *)calloc(96u, 1u);
      if (comp->status_message != NULL) snprintf(comp->status_message, 32u, "OK");
      if (comp->status_buffer != NULL) memset(comp->status_buffer, 0, 96u);
      comp->status_size = 0u;
      comp->status_pos = 0u;
    destroy: |
      if (comp->read_buffer != NULL) {
          free(comp->read_buffer);
          comp->read_buffer = NULL;
      }
      if (comp->pending_name != NULL) {
          free(comp->pending_name);
          comp->pending_name = NULL;
      }
      if (comp->current_name != NULL) {
          free(comp->current_name);
          comp->current_name = NULL;
      }
      if (comp->status_message != NULL) {
          free(comp->status_message);
          comp->status_message = NULL;
      }
      if (comp->status_buffer != NULL) {
          free(comp->status_buffer);
          comp->status_buffer = NULL;
      }
  callback_handlers:
    kernal_load: |
      const uint8_t *image = NULL;
      uint32_t image_size = 0u;
      uint8_t track_count = 0u;
      uint8_t fn_len;
      uint8_t file_num;
      uint8_t secondary;
      uint8_t device;
      uint16_t fn_ptr;
      uint16_t load_addr;
      uint16_t end_addr = 0u;
      uint8_t verify_flag;
      uint8_t status_code = 0u;
      uint8_t success = 0u;
      uint8_t is_directory = 0u;
      static const uint8_t spt_table[42] = {
          0u,
          21u,21u,21u,21u,21u,21u,21u,21u,21u,21u,21u,21u,21u,21u,21u,21u,21u,
          19u,19u,19u,19u,19u,19u,19u,
          18u,18u,18u,18u,18u,18u,
          17u,17u,17u,17u,17u,17u,17u,17u,17u,17u,17u
      };
      uint32_t cumulative[43];
      uint8_t name_buf[17];
      uint8_t i;
      uint8_t dir_name[17];
      uint8_t dir_id[6];
      uint16_t basic_start;
      uint16_t memtop;
      uint8_t *ram;
      uint16_t txttab;
      uint16_t varptr;
      uint16_t line_addr;
      uint16_t loaded_start = 0u;
      uint8_t sp8;
      uint16_t ret_addr;
      FILE *trace_fp = NULL;
      const char *trace_env = getenv("PASM_C64_LOAD_TRACE");
      if (trace_env != NULL && trace_env[0] != '\0' && trace_env[0] != '0') {
          const char *trace_path = getenv("PASM_C64_LOAD_TRACE_FILE");
          if (trace_path == NULL || trace_path[0] == '\0') trace_path = "/tmp/c64_load_trace.log";
          trace_fp = fopen(trace_path, "a");
      }
      if (cpu_component_dispatch_callback(cpu, comp->media_component, "query_media_loaded", NULL, 0u) == 0u) {
          if (trace_fp != NULL) {
              fprintf(trace_fp, "load_early media_loaded=0 media_component=%s\n",
                      (comp->media_component != NULL) ? comp->media_component : "<null>");
              fclose(trace_fp);
          }
          return 0u;
      }
      image = (const uint8_t *)(uintptr_t)cpu_component_dispatch_callback(cpu, comp->media_component, "query_image_data", NULL, 0u);
      image_size = (uint32_t)cpu_component_dispatch_callback(cpu, comp->media_component, "query_image_size", NULL, 0u);
      track_count = (uint8_t)cpu_component_dispatch_callback(cpu, comp->media_component, "query_track_count", NULL, 0u);
      if (image == NULL || image_size == 0u || track_count == 0u) {
          if (trace_fp != NULL) {
              fprintf(trace_fp, "load_early image=%p size=%u tracks=%u media_component=%s\n",
                      (void *)image,
                      (unsigned)image_size,
                      (unsigned)track_count,
                      (comp->media_component != NULL) ? comp->media_component : "<null>");
              fclose(trace_fp);
          }
          return 0u;
      }
      cumulative[0] = 0u;
      for (i = 1u; i <= track_count && i < 43u; ++i) {
          cumulative[i] = cumulative[i - 1u] + (uint32_t)spt_table[i];
      }
      fn_len = mos6510_read_byte(cpu, 0x00B7u);
      file_num = mos6510_read_byte(cpu, 0x00B8u);
      secondary = mos6510_read_byte(cpu, 0x00B9u);
      device = mos6510_read_byte(cpu, 0x00BAu);
      fn_ptr = (uint16_t)mos6510_read_byte(cpu, 0x00BBu) | (uint16_t)((uint16_t)mos6510_read_byte(cpu, 0x00BCu) << 8u);
      verify_flag = cpu->registers[REG_A];
      load_addr = (uint16_t)cpu->registers[REG_X] | (uint16_t)((uint16_t)cpu->registers[REG_Y] << 8u);
      txttab = (uint16_t)mos6510_read_byte(cpu, 0x002Bu) | (uint16_t)((uint16_t)mos6510_read_byte(cpu, 0x002Cu) << 8u);
      memtop = (uint16_t)mos6510_read_byte(cpu, 0x0037u) | (uint16_t)((uint16_t)mos6510_read_byte(cpu, 0x0038u) << 8u);
      ram = cpu->memory;
      (void)file_num;
      if (device == 1u && cpu_component_dispatch_callback(cpu, comp->media_component, "query_media_loaded", NULL, 0u) != 0u) {
          device = 8u;
          mos6510_write_byte(cpu, 0x00BAu, 8u);
      }
      if (trace_fp != NULL) {
          fprintf(trace_fp,
                  "load_enter pc=%04X a=%02X x=%02X y=%02X sp=%02X fnlen=%u lfn=%u sa=%u dev=%u fnptr=%04X txttab=%04X memtop=%04X loaded=%u media_component=%s\n",
                  (unsigned)cpu->pc,
                  (unsigned)cpu->registers[REG_A],
                  (unsigned)cpu->registers[REG_X],
                  (unsigned)cpu->registers[REG_Y],
                  (unsigned)cpu->sp,
                  (unsigned)fn_len,
                  (unsigned)file_num,
                  (unsigned)secondary,
                  (unsigned)device,
                  (unsigned)fn_ptr,
                  (unsigned)txttab,
                  (unsigned)memtop,
                  (unsigned)cpu_component_dispatch_callback(cpu, comp->media_component, "query_media_loaded", NULL, 0u),
                  (comp->media_component != NULL) ? comp->media_component : "<null>");
          if (fn_len != 0u) {
              uint8_t ti;
              fputs("load_name bytes=", trace_fp);
              for (ti = 0u; ti < fn_len && ti < 32u; ++ti) {
                  fprintf(trace_fp, "%02X", (unsigned)mos6510_read_byte(cpu, (uint16_t)(fn_ptr + ti)));
                  if ((ti + 1u) < fn_len && ti < 31u) fputc(' ', trace_fp);
              }
              fputc('\n', trace_fp);
          }
          fflush(trace_fp);
      }
      if (device != 8u) return 0u;
      if (verify_flag != 0u) {
          status_code = 0x1Cu;
          goto load_done;
      }
      if (ram == NULL || cpu->memory_size < 0x10000u) {
          status_code = 0x05u;
          goto load_done;
      }
      for (i = 0u; i < 16u; ++i) name_buf[i] = 0u;
      for (i = 0u; i < fn_len && i < 16u; ++i) {
          uint8_t c = mos6510_read_byte(cpu, (uint16_t)(fn_ptr + i));
          if (c >= 0x61u && c <= 0x7Au) c = (uint8_t)(c - 0x20u);
          else if (c >= 0xC1u && c <= 0xDAu) c = (uint8_t)(c - 0x80u);
          else if (c >= 0x41u && c <= 0x5Au) c = c;
          else if (c >= 0x30u && c <= 0x39u) c = c;
          else if (c == 0xA0u) c = ' ';
          name_buf[i] = c;
      }
      if (fn_len == 0u || name_buf[0] == '$') {
          is_directory = 1u;
      }
      if (is_directory != 0u) {
          uint32_t bam_off;
          uint32_t dir_off;
          uint8_t next_track;
          uint8_t next_sector;
          uint16_t blocks_free = 0u;
          uint8_t disk_name_len = 0u;
          uint8_t disk_id_len = 0u;
          uint8_t line_no;
          if (track_count < 18u) {
              status_code = 0x04u;
              goto load_done;
          }
          bam_off = (cumulative[17u] + 0u) * 256u;
          dir_off = (cumulative[17u] + 1u) * 256u;
          if ((bam_off + 256u) > image_size || (dir_off + 256u) > image_size) {
              status_code = 0x04u;
              goto load_done;
          }
          for (i = 0u; i < 16u; ++i) {
              uint8_t c = image[bam_off + 144u + i];
              if (c == 0xA0u || c == 0u) break;
              if (c >= 0xC1u && c <= 0xDAu) c = (uint8_t)(c - 0x80u);
              dir_name[disk_name_len++] = c;
          }
          dir_name[disk_name_len] = 0u;
          for (i = 0u; i < 2u; ++i) {
              uint8_t c = image[bam_off + 162u + i];
              if (c == 0xA0u || c == 0u) break;
              if (c >= 0xC1u && c <= 0xDAu) c = (uint8_t)(c - 0x80u);
              dir_id[disk_id_len++] = c;
          }
          dir_id[disk_id_len] = 0u;
          for (i = 1u; i <= track_count; ++i) {
              if ((4u * (uint32_t)(i - 1u) + 4u) < 256u) {
                  blocks_free = (uint16_t)(blocks_free + image[bam_off + 4u + 4u * (uint32_t)(i - 1u)]);
              }
          }
          basic_start = 0x0801u;
          line_addr = basic_start;
          cpu->memory[line_addr + 0u] = 0u;
          cpu->memory[line_addr + 1u] = 0u;
          cpu->memory[line_addr + 2u] = 0u;
          cpu->memory[line_addr + 3u] = 0u;
          {
              uint8_t pos = 4u;
              cpu->memory[line_addr + pos++] = '"';
              for (i = 0u; i < disk_name_len && pos < 250u; ++i) cpu->memory[line_addr + pos++] = dir_name[i];
              cpu->memory[line_addr + pos++] = '"';
              if (disk_id_len != 0u) {
                  cpu->memory[line_addr + pos++] = ' ';
                  for (i = 0u; i < disk_id_len && pos < 250u; ++i) cpu->memory[line_addr + pos++] = dir_id[i];
              }
              cpu->memory[line_addr + pos++] = 0u;
              end_addr = (uint16_t)(line_addr + pos);
              cpu->memory[line_addr + 0u] = (uint8_t)(end_addr & 0xFFu);
              cpu->memory[line_addr + 1u] = (uint8_t)((end_addr >> 8u) & 0xFFu);
          }
          next_track = image[dir_off + 0u];
          next_sector = image[dir_off + 1u];
          while (1) {
              uint8_t entry;
              for (entry = 0u; entry < 8u; ++entry) {
                  uint32_t ent = dir_off + 2u + (uint32_t)entry * 32u;
                  uint8_t file_type = image[ent + 0u];
                  uint8_t blocks_lo = image[ent + 28u];
                  uint8_t blocks_hi = image[ent + 29u];
                  uint16_t blocks = (uint16_t)blocks_lo | (uint16_t)((uint16_t)blocks_hi << 8u);
                  uint8_t file_name_len = 0u;
                  uint8_t file_name[17];
                  const char *type_name = "DEL";
                  if ((file_type & 0x07u) == 0u) continue;
                  if ((file_type & 0x07u) == 1u) type_name = "SEQ";
                  else if ((file_type & 0x07u) == 2u) type_name = "PRG";
                  else if ((file_type & 0x07u) == 3u) type_name = "USR";
                  else if ((file_type & 0x07u) == 4u) type_name = "REL";
                  for (i = 0u; i < 16u; ++i) {
                      uint8_t c = image[ent + 3u + i];
                      if (c == 0xA0u || c == 0u) break;
                      if (c >= 0xC1u && c <= 0xDAu) c = (uint8_t)(c - 0x80u);
                      file_name[file_name_len++] = c;
                  }
                  file_name[file_name_len] = 0u;
                  line_addr = end_addr;
                  line_no = (uint8_t)(blocks & 0xFFu);
                  cpu->memory[line_addr + 2u] = line_no;
                  cpu->memory[line_addr + 3u] = (uint8_t)((blocks >> 8u) & 0xFFu);
                  {
                      uint8_t pos = 4u;
                      uint8_t space_count = 0u;
                      if (blocks < 10u) space_count = 3u;
                      else if (blocks < 100u) space_count = 2u;
                      else if (blocks < 1000u) space_count = 1u;
                      while (space_count-- != 0u && pos < 250u) cpu->memory[line_addr + pos++] = ' ';
                      cpu->memory[line_addr + pos++] = '"';
                      for (i = 0u; i < file_name_len && pos < 250u; ++i) cpu->memory[line_addr + pos++] = file_name[i];
                      cpu->memory[line_addr + pos++] = '"';
                      cpu->memory[line_addr + pos++] = ' ';
                      while (*type_name != '\0' && pos < 250u) cpu->memory[line_addr + pos++] = (uint8_t)*type_name++;
                      cpu->memory[line_addr + pos++] = 0u;
                      end_addr = (uint16_t)(line_addr + pos);
                      cpu->memory[line_addr + 0u] = (uint8_t)(end_addr & 0xFFu);
                      cpu->memory[line_addr + 1u] = (uint8_t)((end_addr >> 8u) & 0xFFu);
                  }
              }
              if (next_track == 0u) break;
              if (next_track > track_count || next_sector >= spt_table[next_track]) break;
              dir_off = (cumulative[next_track - 1u] + (uint32_t)next_sector) * 256u;
              if ((dir_off + 256u) > image_size) break;
              next_track = image[dir_off + 0u];
              next_sector = image[dir_off + 1u];
          }
          line_addr = end_addr;
          cpu->memory[line_addr + 2u] = (uint8_t)(blocks_free & 0xFFu);
          cpu->memory[line_addr + 3u] = (uint8_t)((blocks_free >> 8u) & 0xFFu);
          {
              static const char tail[] = "BLOCKS FREE.";
              uint8_t pos = 4u;
              for (i = 0u; i < sizeof(tail) - 1u && pos < 250u; ++i) cpu->memory[line_addr + pos++] = (uint8_t)tail[i];
              cpu->memory[line_addr + pos++] = 0u;
              end_addr = (uint16_t)(line_addr + pos);
              cpu->memory[line_addr + 0u] = 0u;
              cpu->memory[line_addr + 1u] = 0u;
              cpu->memory[end_addr + 0u] = 0u;
              cpu->memory[end_addr + 1u] = 0u;
          }
          varptr = end_addr;
          mos6510_write_byte(cpu, 0x002Bu, (uint8_t)(basic_start & 0xFFu));
          mos6510_write_byte(cpu, 0x002Cu, (uint8_t)((basic_start >> 8u) & 0xFFu));
          mos6510_write_byte(cpu, 0x002Du, (uint8_t)(varptr & 0xFFu));
          mos6510_write_byte(cpu, 0x002Eu, (uint8_t)((varptr >> 8u) & 0xFFu));
          mos6510_write_byte(cpu, 0x002Fu, (uint8_t)(varptr & 0xFFu));
          mos6510_write_byte(cpu, 0x0030u, (uint8_t)((varptr >> 8u) & 0xFFu));
          mos6510_write_byte(cpu, 0x0031u, (uint8_t)(varptr & 0xFFu));
          mos6510_write_byte(cpu, 0x0032u, (uint8_t)((varptr >> 8u) & 0xFFu));
          mos6510_write_byte(cpu, 0x0033u, (uint8_t)(memtop & 0xFFu));
          mos6510_write_byte(cpu, 0x0034u, (uint8_t)((memtop >> 8u) & 0xFFu));
          end_addr = varptr;
          success = 1u;
          goto load_done;
      }
      {
          uint8_t match_found = 0u;
          uint8_t file_track = 0u;
          uint8_t file_sector = 0u;
          uint8_t wanted_type = 2u;
          uint32_t dir_off = (cumulative[17u] + 1u) * 256u;
          uint8_t next_track = (dir_off + 1u < image_size) ? image[dir_off + 0u] : 0u;
          uint8_t next_sector = (dir_off + 1u < image_size) ? image[dir_off + 1u] : 0u;
          while (dir_off + 256u <= image_size) {
              uint8_t entry;
              for (entry = 0u; entry < 8u; ++entry) {
                  uint32_t ent = dir_off + 2u + (uint32_t)entry * 32u;
                  uint8_t file_type = image[ent + 0u];
                  uint8_t entry_name[17];
                  uint8_t entry_len = 0u;
                  uint8_t j;
                  uint8_t matched = 1u;
                  uint8_t wildcard = 0u;
                  if ((file_type & 0x07u) != wanted_type) continue;
                  for (j = 0u; j < 16u; ++j) {
                      uint8_t c = image[ent + 3u + j];
                      if (c == 0xA0u || c == 0u) break;
                      if (c >= 0xC1u && c <= 0xDAu) c = (uint8_t)(c - 0x80u);
                      entry_name[entry_len++] = c;
                  }
                  entry_name[entry_len] = 0u;
                  if (fn_len == 1u && name_buf[0] == '*') {
                      matched = 1u;
                  } else {
                      for (j = 0u; j < fn_len && j < 16u; ++j) {
                          uint8_t p = name_buf[j];
                          uint8_t e = (j < entry_len) ? entry_name[j] : 0u;
                          if (p == '*') { wildcard = 1u; break; }
                          if (p == '?') continue;
                          if (p != e) { matched = 0u; break; }
                      }
                      if (matched != 0u && wildcard == 0u && fn_len != entry_len) matched = 0u;
                  }
                  if (matched == 0u) continue;
                  file_track = image[ent + 1u];
                  file_sector = image[ent + 2u];
                  match_found = 1u;
                  break;
              }
              if (match_found != 0u) break;
              if (next_track == 0u) break;
              if (next_track > track_count || next_sector >= spt_table[next_track]) break;
              dir_off = (cumulative[next_track - 1u] + (uint32_t)next_sector) * 256u;
              if ((dir_off + 256u) > image_size) break;
              next_track = image[dir_off + 0u];
              next_sector = image[dir_off + 1u];
          }
          if (match_found == 0u) {
              status_code = 0x04u;
              goto load_done;
          }
          {
              uint8_t first = 1u;
              uint16_t dst = load_addr;
              while (file_track != 0u) {
                  uint32_t off;
                  uint8_t next_t;
                  uint8_t next_s;
                  uint16_t count;
                  uint16_t start_index;
                  if (file_track > track_count || file_sector >= spt_table[file_track]) {
                      status_code = 0x04u;
                      goto load_done;
                  }
                  off = (cumulative[file_track - 1u] + (uint32_t)file_sector) * 256u;
                  if ((off + 256u) > image_size) {
                      status_code = 0x04u;
                      goto load_done;
                  }
                  next_t = image[off + 0u];
                  next_s = image[off + 1u];
                  start_index = 2u;
                  if (first != 0u) {
                      uint16_t file_load_addr = (uint16_t)image[off + 2u] | (uint16_t)((uint16_t)image[off + 3u] << 8u);
                      if (secondary != 0u) dst = file_load_addr;
                      loaded_start = dst;
                      start_index = 4u;
                      first = 0u;
                  }
                  if (next_t == 0u) {
                      if (next_s == 0u) count = 0u;
                      else count = (uint16_t)(next_s - 1u);
                      if (count < (start_index - 2u)) count = 0u;
                      else count = (uint16_t)(count - (start_index - 2u));
                  } else {
                      count = (uint16_t)(256u - start_index);
                  }
                  if (count > cpu->memory_size) {
                      status_code = 0x09u;
                      goto load_done;
                  }
                  for (uint16_t copy_i = 0u; copy_i < count; ++copy_i) {
                      uint16_t write_addr = (uint16_t)(dst + copy_i);
                      if ((uint32_t)write_addr >= cpu->memory_size) {
                          status_code = 0x09u;
                          goto load_done;
                      }
                      mos6510_write_byte(cpu, write_addr, image[off + start_index + copy_i]);
                  }
                  dst = (uint16_t)(dst + count);
                  file_track = next_t;
                  file_sector = next_s;
              }
              end_addr = dst;
