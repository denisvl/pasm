metadata:
  id: apple2_char_rom
  type: memory_mapper
  model: character_generator_rom
  version: "1.0"

# Character generator ROM (Apple II 341-0036).
# 2 KiB: 256 glyphs x 8 bytes each. NOT CPU-addressable; served to the
# video softswitches IC for text-to-pixel rendering via direct state access.
state:
  - name: rom_data
    type: uint8_t *
    initial: "NULL"
  - name: rom_size
    type: uint32_t
    initial: "0"

interfaces:
  callbacks: []
  handlers: []
  signals: []

maps:
  memory:
    ranges: []

behavior:
  snippets:
    init: |
      /* Load the Apple II character generator ROM (341-0036, 2 KiB). */
      comp->rom_data = NULL;
      comp->rom_size = 0;
      const char *rom_rel = "../../roms/apple2/Apple II Character ROM - 341-0036.bin";
      char rom_path[1024];
      const char *sysdir = getenv("PASM_SYSTEM_DIR");
      FILE *fp = NULL;
      if (sysdir != NULL && sysdir[0] != '\0') {
          snprintf(rom_path, sizeof(rom_path), "%s/%s", sysdir, rom_rel);
          fp = fopen(rom_path, "rb");
      }
      if (fp == NULL) {
          /* Fallback: path relative to CWD (repo root). */
          snprintf(rom_path, sizeof(rom_path), "examples/roms/apple2/Apple II Character ROM - 341-0036.bin");
          fp = fopen(rom_path, "rb");
      }
      if (fp == NULL) {
          fprintf(stderr, "[apple2_char_rom] failed to open character ROM: %s\n", rom_path);
      } else {
          fseek(fp, 0, SEEK_END);
          long sz = ftell(fp);
          fseek(fp, 0, SEEK_SET);
          if (sz > 0) {
              comp->rom_data = (uint8_t *)malloc((size_t)sz);
              if (comp->rom_data != NULL) {
                  size_t got = fread(comp->rom_data, 1, (size_t)sz, fp);
                  comp->rom_size = (uint32_t)got;
              }
          }
          fclose(fp);
          if (comp->rom_data == NULL) {
              fprintf(stderr, "[apple2_char_rom] failed to read character ROM (%ld bytes)\n", sz);
          }
      }
    destroy: |
      if (comp->rom_data != NULL) {
          free(comp->rom_data);
          comp->rom_data = NULL;
      }
      comp->rom_size = 0;
  callback_handlers: {}
  handler_bodies: {}

coding:
  headers:
    - <stdio.h>
    - <stdlib.h>
    - <string.h>
  include_paths: []
  linked_libraries: []
  library_paths: []
